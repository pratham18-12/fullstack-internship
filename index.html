<!DOCTYPE html>
<html>

<head>

<title>Blog App</title>

<style>

body{
font-family:Arial;
width:600px;
margin:auto;
padding-top:30px;
}

input,textarea{
width:100%;
padding:10px;
margin:10px 0;
}

button{
padding:10px 20px;
background:blue;
color:white;
border:none;
cursor:pointer;
}

.blog{

padding:10px;
margin-top:20px;
}

</head>
<body>

<div class="container">

<h1>Simple Blog App</h1>

<input type="text" id="title" placeholder="Blog Title">

<textarea id="content" placeholder="Blog Content"></textarea>

<button onclick="addBlog()">Add Blog</button>

<hr>

<h2>All Blogs</h2>

<div id="blogs"></div>

</div>

<script src="script.js"></script>

</body>

</html>
